; All CDN components in one container (Hugging Face Spaces deployment).
; Topology and ports mirror docker-compose.yml, but everything talks over 127.0.0.1.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/cdn/supervisord.pid
environment=MINIO_ENDPOINT="127.0.0.1:9000",MINIO_ACCESS_KEY="cdnadmin",MINIO_SECRET_KEY="cdnadmin-secret",SHIELD_URL="http://127.0.0.1:8010",ORIGIN_URL="http://127.0.0.1:8020",EDGE_URLS="edge-1=http://127.0.0.1:8001,edge-2=http://127.0.0.1:8002,edge-3=http://127.0.0.1:8003"

[program:redis-edge-1]
command=redis-server --port 6379 --bind 127.0.0.1 --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis-edge-2]
command=redis-server --port 6380 --bind 127.0.0.1 --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis-edge-3]
command=redis-server --port 6381 --bind 127.0.0.1 --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis-shield]
command=redis-server --port 6382 --bind 127.0.0.1 --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:minio]
command=minio server /tmp/cdn/minio --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 --quiet
environment=MINIO_ROOT_USER="cdnadmin",MINIO_ROOT_PASSWORD="cdnadmin-secret",MINIO_BROWSER="off"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:origin]
command=uvicorn cdn.origin:app --host 127.0.0.1 --port 8020 --log-level warning --no-access-log
directory=/app
environment=NODE_ID="origin"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:shield]
command=uvicorn cdn.shield:app --host 127.0.0.1 --port 8010 --log-level warning --no-access-log
directory=/app
environment=NODE_ID="shield",REDIS_URL="redis://127.0.0.1:6382/0"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:edge-1]
command=uvicorn cdn.edge:app --host 127.0.0.1 --port 8001 --log-level warning --no-access-log
directory=/app
environment=NODE_ID="edge-1",REDIS_URL="redis://127.0.0.1:6379/0"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:edge-2]
command=uvicorn cdn.edge:app --host 127.0.0.1 --port 8002 --log-level warning --no-access-log
directory=/app
environment=NODE_ID="edge-2",REDIS_URL="redis://127.0.0.1:6380/0"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:edge-3]
command=uvicorn cdn.edge:app --host 127.0.0.1 --port 8003 --log-level warning --no-access-log
directory=/app
environment=NODE_ID="edge-3",REDIS_URL="redis://127.0.0.1:6381/0"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:router]
command=uvicorn cdn.router:app --host 0.0.0.0 --port %(ENV_PORT)s --log-level info --no-access-log --proxy-headers --forwarded-allow-ips="*"
directory=/app
environment=NODE_ID="router"
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
