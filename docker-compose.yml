# Every microservice in its own container. Each cache here uses a separate Redis container.
#   docker compose up --build
#   newspaper: http://localhost:8080   dashboard: http://localhost:8080/dashboard.html
#   router API: http://localhost:8000/docs   MinIO console: http://localhost:9001

x-redis: &redis
  image: redis:7.4-alpine
  command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
  restart: unless-stopped

x-env: &env
  PORT: "8000"
  MINIO_ACCESS_KEY: cdnadmin
  MINIO_SECRET_KEY: cdnadmin-secret

services:
  minio:
    build: { context: ., dockerfile: services/minio/Dockerfile }
    environment: { <<: *env, PORT: "9000" }
    ports: ["9001:9001"]
    volumes: [minio-data:/data]
    restart: unless-stopped

  origin:
    build: { context: ., dockerfile: services/origin/Dockerfile }
    environment: { <<: *env, NODE_ID: origin, MINIO_ENDPOINT: "minio:9000" }
    depends_on: [minio]
    restart: unless-stopped

  redis-shield:
    <<: *redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
  shield:
    build: { context: ., dockerfile: services/shield/Dockerfile }
    environment: { <<: *env, NODE_ID: shield, ORIGIN_URL: "http://origin:8000", REDIS_URL: "redis://redis-shield:6379/0" }
    depends_on: [redis-shield, origin]
    restart: unless-stopped

  redis-edge-1: *redis
  edge-1:
    build: &edge-build { context: ., dockerfile: services/edge/Dockerfile }
    environment: { <<: *env, NODE_ID: edge-1, SHIELD_URL: "http://shield:8000", ORIGIN_URL: "http://origin:8000", REDIS_URL: "redis://redis-edge-1:6379/0" }
    depends_on: [redis-edge-1, shield]
    restart: unless-stopped

  redis-edge-2: *redis
  edge-2:
    build: *edge-build
    environment: { <<: *env, NODE_ID: edge-2, SHIELD_URL: "http://shield:8000", ORIGIN_URL: "http://origin:8000", REDIS_URL: "redis://redis-edge-2:6379/0" }
    depends_on: [redis-edge-2, shield]
    restart: unless-stopped

  redis-edge-3: *redis
  edge-3:
    build: *edge-build
    environment: { <<: *env, NODE_ID: edge-3, SHIELD_URL: "http://shield:8000", ORIGIN_URL: "http://origin:8000", REDIS_URL: "redis://redis-edge-3:6379/0" }
    depends_on: [redis-edge-3, shield]
    restart: unless-stopped

  router:
    build: { context: ., dockerfile: services/router/Dockerfile }
    environment:
      <<: *env
      NODE_ID: router
      SHIELD_URL: http://shield:8000
      ORIGIN_URL: http://origin:8000
      EDGE_URLS: edge-1=http://edge-1:8000,edge-2=http://edge-2:8000,edge-3=http://edge-3:8000
    ports: ["8000:8000"]
    depends_on: [edge-1, edge-2, edge-3]
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    volumes: ["./services/web:/usr/share/nginx/html:ro"]
    ports: ["8080:80"]
    restart: unless-stopped

volumes:
  minio-data:
